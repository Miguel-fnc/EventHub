name: EventHub
on:
  pull_request:
  push:
    branches: ['feature/**', develop, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix backend
      - name: Backend unit tests
        run: npm test --prefix backend
      - name: Type-check backend
        run: npm run build --prefix backend
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Integration test on a local Worker with D1
        working-directory: backend
        run: |
          npx wrangler d1 migrations apply DB --local
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:8787/api/health
          curl --fail --json '{"email":"admin@example.test","password":"eventhub-ci-demo-password"}' http://127.0.0.1:8787/api/auth/register
          npx wrangler d1 execute DB --local --command "UPDATE users SET role = 'admin' WHERE email = 'admin@example.test';"
          EVENTHUB_URL=http://127.0.0.1:8787 node ../infra/smoke.mjs
      - if: failure()
        run: cat backend/wrangler.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  deploy:
    # develop → Dev, main → Prod. Se habilita con la variable de repositorio DEPLOY_ENABLED=true.
    if: >-
      vars.DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    needs: build
    name: Deploy to ${{ github.ref == 'refs/heads/main' && 'Prod' || 'Dev' }}
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'Prod' || 'Dev' }}
      url: ${{ vars.APP_URL }}
    runs-on: ubuntu-latest
    concurrency:
      group: eventhub-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SENTRY_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
      # Sentry es opcional: sin SENTRY_AUTH_TOKEN se omiten la release y los source maps.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ORG: infra-desarrollo-continuo-rj
      SENTRY_PROJECT: eventhub
      SENTRY_RELEASE: eventhub@${{ github.sha }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sentry necesita el historial para asociar commits a la release.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      # Despliega exactamente el frontend que pasó las pruebas.
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Select Wrangler environment
        # Prod es el entorno principal de wrangler.jsonc (--env=""), Dev es --env=dev.
        run: echo "WRANGLER_ENV=$([ "$SENTRY_ENVIRONMENT" = production ] && echo '' || echo dev)" >> "$GITHUB_ENV"
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --env="$WRANGLER_ENV"
      - name: Bundle the Worker with source maps
        run: npx wrangler deploy --dry-run --outdir dist --env="$WRANGLER_ENV"
      - name: Create Sentry release and upload source maps
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          npx sentry-cli releases new "$SENTRY_RELEASE"
          npx sentry-cli sourcemaps inject dist
          npx sentry-cli sourcemaps upload --release "$SENTRY_RELEASE" dist
          npx sentry-cli releases set-commits "$SENTRY_RELEASE" --auto --ignore-missing \
            || echo "::warning::No se pudieron asociar commits a la release de Sentry"
      - name: Deploy the Worker
        # Sube el mismo bundle al que se le inyectaron los debug IDs de Sentry.
        run: |
          vars=(--var "SENTRY_RELEASE:$SENTRY_RELEASE")
          [ -n "$SENTRY_DSN" ] && vars+=(--var "SENTRY_DSN:$SENTRY_DSN")
          npx wrangler deploy dist/index.js --no-bundle --env="$WRANGLER_ENV" "${vars[@]}"
      - name: Verify health
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "$APP_URL/api/health"
      - name: Finalize Sentry release and record the deploy
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          npx sentry-cli releases finalize "$SENTRY_RELEASE"
          npx sentry-cli deploys new --release "$SENTRY_RELEASE" -e "$SENTRY_ENVIRONMENT"

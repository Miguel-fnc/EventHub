name: EventHub
on:
  pull_request:
  push:
    branches: ['feature/**', develop, main]
  workflow_dispatch:
    inputs:
      dev_run_id:
        description: 'ID de la ejecución exitosa que desplegó a Dev'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix backend
      - name: Backend unit tests
        run: npm test --prefix backend
      - run: npm run build --prefix backend
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Verify container startup
        env:
          POSTGRES_PASSWORD: eventhub-ci
        run: |
          docker compose up -d --build
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/api/health
          curl --fail --json '{"email":"admin@example.test","password":"eventhub-ci-demo-password"}' http://127.0.0.1:8080/api/auth/register
          docker compose exec -T db psql -v ON_ERROR_STOP=1 -U eventhub -d eventhub -c "UPDATE users SET role = 'admin' WHERE email = 'admin@example.test';"
          node infra/smoke.mjs
      - if: failure()
        run: docker compose logs
  publish-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && (vars.PUBLISH_ENABLED == 'true' || vars.DEPLOY_ENABLED == 'true')
    needs: build
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.images.outputs.release }}
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish immutable image references
        id: images
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          for service in frontend backend; do
            image="$DOCKERHUB_USERNAME/eventhub-$service"
            docker buildx build --push --metadata-file "$service.json" -t "$image:$GITHUB_SHA" "$service"
            digest=$(jq -er '."containerimage.digest"' "$service.json")
            printf '%s@%s\n' "$image" "$digest" > "$service.image"
          done
          release=$(jq -nc --arg sha "$GITHUB_SHA" --arg frontend "$(cat frontend.image)" --arg backend "$(cat backend.image)" '$ARGS.named')
          printf 'release=%s\n' "$release" >> "$GITHUB_OUTPUT"

  verify-promotion:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the selected Dev run
        id: dev-run
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_RUN_ID: ${{ inputs.dev_run_id }}
        run: |
          [[ "$DEV_RUN_ID" =~ ^[0-9]+$ ]]
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEV_RUN_ID")
          sha=$(jq -er 'select(.path == ".github/workflows/eventhub.yml" and .event == "push" and .head_branch == "develop" and .conclusion == "success") | .head_sha' <<< "$run")
          git fetch origin "$sha"
          git diff --quiet "$sha" "$GITHUB_SHA" --
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: eventhub-verified-dev-release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.dev_run_id }}
      - name: Read the images verified in Dev
        id: release
        env:
          DEV_SHA: ${{ steps.dev-run.outputs.sha }}
        run: |
          release=$(jq -ce --arg sha "$DEV_SHA" 'select(.sha == $sha)' release.json)
          printf 'release=%s\n' "$release" >> "$GITHUB_OUTPUT"

  deploy:
    if: always() && vars.DEPLOY_ENABLED == 'true' && (needs.publish-dev.result == 'success' || needs.verify-promotion.result == 'success')
    needs: [publish-dev, verify-promotion]
    name: Deploy to ${{ github.event_name == 'workflow_dispatch' && 'Prod' || 'Dev' }}
    environment: ${{ github.event_name == 'workflow_dispatch' && 'Prod' || 'Dev' }}
    runs-on: ubuntu-latest
    concurrency:
      group: eventhub-deploy-${{ github.event_name == 'workflow_dispatch' && 'prod' || 'dev' }}
      cancel-in-progress: false
    env:
      RELEASE: ${{ needs.publish-dev.outputs.release || needs.verify-promotion.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Dev on EC2 via Systems Manager
        if: github.event_name == 'push'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          : "${AWS_ACCESS_KEY_ID:?Missing Dev AWS_ACCESS_KEY_ID}"
          : "${AWS_SECRET_ACCESS_KEY:?Missing Dev AWS_SECRET_ACCESS_KEY}"
          : "${AWS_SESSION_TOKEN:?Missing Dev AWS_SESSION_TOKEN}"
          : "${AWS_DEFAULT_REGION:?Missing Dev AWS_REGION}"
          [[ "$INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]]
          frontend=$(jq -er '.frontend' <<< "$RELEASE")
          backend=$(jq -er '.backend' <<< "$RELEASE")
          [[ "$frontend" =~ ^[a-z0-9_-]+/eventhub-frontend@sha256:[a-f0-9]{64}$ ]]
          [[ "$backend" =~ ^[a-z0-9_-]+/eventhub-backend@sha256:[a-f0-9]{64}$ ]]
          bundle=$(tar -czf - compose.yaml infra/deploy.sh backend/sql | base64 -w0)
          command=$(cat <<EOF
          set -eu
          runuser -u ubuntu -- mkdir -p /home/ubuntu/eventhub
          printf '%s' '$bundle' | base64 -d | runuser -u ubuntu -- tar --no-same-permissions --no-overwrite-dir -xzf - -C /home/ubuntu/eventhub
          runuser -u ubuntu -- env FRONTEND_IMAGE='$frontend' BACKEND_IMAGE='$backend' bash /home/ubuntu/eventhub/infra/deploy.sh
          EOF
          )
          jq -n --arg command "$command" '{commands: [$command], executionTimeout: ["600"]}' > "$RUNNER_TEMP/deploy-ssm.json"
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --parameters "file://$RUNNER_TEMP/deploy-ssm.json" \
            --query 'Command.CommandId' --output text)
          for attempt in {1..132}; do
            if result=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" 2>"$RUNNER_TEMP/ssm-error"); then
              status=$(jq -er '.Status' <<< "$result")
              case "$status" in
                Pending|InProgress|Delayed|Cancelling) ;;
                *)
                  jq -r '.Status, .StandardOutputContent, .StandardErrorContent' <<< "$result"
                  [[ "$status" == Success ]]
                  printf '%s\n' "$RELEASE" > release.json
                  exit 0
                  ;;
              esac
            elif ! grep -q InvocationDoesNotExist "$RUNNER_TEMP/ssm-error"; then
              cat "$RUNNER_TEMP/ssm-error" >&2
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for SSM command $command_id" >&2
          exit 1
      - name: Deploy Prod on EC2 via SSH
        if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          frontend=$(jq -er '.frontend' <<< "$RELEASE")
          backend=$(jq -er '.backend' <<< "$RELEASE")
          [[ "$frontend" =~ ^[a-z0-9_-]+/eventhub-frontend@sha256:[a-f0-9]{64}$ ]]
          [[ "$backend" =~ ^[a-z0-9_-]+/eventhub-backend@sha256:[a-f0-9]{64}$ ]]
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/eventhub
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/eventhub
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh_options=(-i ~/.ssh/eventhub -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          tar -czf - compose.yaml infra/deploy.sh backend/sql | ssh "${ssh_options[@]}" "$DEPLOY_TARGET" '
            set -eu
            mkdir -p ~/eventhub
            tar --no-same-permissions --no-overwrite-dir -xzf - -C ~/eventhub
          '
          ssh "${ssh_options[@]}" "$DEPLOY_TARGET" \
            "cd ~/eventhub && FRONTEND_IMAGE=$frontend BACKEND_IMAGE=$backend bash infra/deploy.sh"
          printf '%s\n' "$RELEASE" > release.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: eventhub-verified-dev-release
          path: release.json
          if-no-files-found: error
